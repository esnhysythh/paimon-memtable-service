# Development-only PMS test server.
# PMSTestServerMain expands ${timestamp} to yyyyMMddHHmmss on each launch.
pms.test.root=pms-server/target/pms-test-server/${timestamp}

pms.server.host=127.0.0.1
pms.server.port=19090
pms.server.commit_user=pms-test-server
pms.server.scheduler.enabled=false
pms.server.scheduler.flush_interval_ms=0
pms.server.scheduler.sink_interval_ms=30000

pms.wal.dir=${pms.test.root}/wal
pms.storage.dir=${pms.test.root}/storage

pms.paimon.warehouse=file:${pms.test.root}/paimon
pms.paimon.database=pms_db
pms.paimon.table=server_pk
pms.paimon.cache_enabled=true
pms.paimon.manifest_cache_small_file_memory=128mb
pms.paimon.manifest_cache_small_file_threshold=1mb

pms.memtable.max_entries=1000000
pms.memtable.max_size_mb=256
pms.sink.interval_ms=30000
pms.sink.max_pending_ssts=8
