# PMS server
pms.server.host=127.0.0.1
pms.server.port=9090
pms.server.commit_user=pms-server
pms.server.scheduler.flush_reconcile_interval_ms=1000
pms.server.scheduler.maintenance_reconcile_interval_ms=30000
pms.paimon.visibility.max_delay_ms=600000

# Binary protocol limits
pms.protocol.strict_http2=true
pms.protocol.max_key_bytes=65536
pms.protocol.max_row_bytes=16777216
pms.protocol.max_batch_entries=1024
pms.protocol.max_concurrent_streams=128
pms.protocol.max_request_body_bytes=33554432
pms.protocol.max_response_body_bytes=33554432

# PMS local state
pms.wal.dir=/tmp/pms/wal
pms.storage.dir=/tmp/pms/storage

# Paimon table
pms.paimon.warehouse=file:/tmp/pms/warehouse
pms.paimon.database=pms_db
pms.paimon.table=server_pk
pms.paimon.cache_enabled=true
pms.paimon.manifest_cache_small_file_memory=128mb
pms.paimon.manifest_cache_small_file_threshold=1mb
# Optional. When set larger than small-file memory, Paimon may cache all manifest files up to this memory.
# pms.paimon.manifest_cache_max_memory=512mb

# Core thresholds
pms.memtable.max_entries=1000000
pms.memtable.max_size_mb=256
pms.storage.new_sst.max_count=10
pms.storage.sinked_sst.max_count=10
pms.operation.sink.batch_max_bytes_mb=1024
pms.operation.compact.max_input_size_mb=1024
pms.flowcontrol.overloaded_immutable_count=4
pms.flowcontrol.overloaded_pending_sst_count=20
